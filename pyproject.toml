[project]
name = "elara-backend"
version = "0.1.0"
description = "Elara AI - Real-time Multimodal Live Audio Companion Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "google-genai>=2.25.0",
    "google-cloud-agentplatform>=2.0.1",
    "google-cloud-firestore>=2.21.0",
    "google-cloud-storage>=3.0.0,<4",
    "google-cloud-tasks>=2.19.0",
    "google-auth>=2.38.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
